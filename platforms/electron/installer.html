<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Stremio Kai 7M Setup</title>
<style>
  :root { --bg:#0b0b0e; --panel:#121319; --card:#181a21; --card2:#1f222b; --line:rgba(255,255,255,0.08); --fg:#f1f2f5; --mut:#9a9fab; --dim:#6b707c; --acc:#a9bbe0; --ok:#7fd1a8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none; }
  body { background: radial-gradient(900px 500px at 85% -10%, rgba(80,96,130,0.22), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(60,70,95,0.25), transparent 60%), var(--bg); }
  .frame { position:absolute; inset:14px; border:1px solid var(--line); border-radius:18px; background:rgba(18,19,25,0.72); display:flex; flex-direction:column; overflow:hidden; }
  .drag { position:absolute; left:0; right:120px; top:0; height:64px; -webkit-app-region:drag; }
  .wc { position:absolute; right:14px; top:12px; display:flex; gap:4px; z-index:3; }
  .wc button { -webkit-app-region:no-drag; width:42px; height:34px; border:0; border-radius:8px; background:transparent; color:var(--mut); font-size:16px; cursor:pointer; }
  .wc button:hover { background:rgba(255,255,255,0.08); color:#fff; }
  header { display:flex; align-items:center; gap:22px; padding:46px 56px 26px; border-bottom:1px solid var(--line); margin:0 56px; padding-left:0; padding-right:0; }
  header img { width:68px; height:68px; border-radius:16px; }
  .kicker { letter-spacing:4px; font-size:12px; color:var(--mut); text-transform:uppercase; }
  h1 { margin:2px 0 0; font-size:40px; font-weight:600; letter-spacing:-0.5px; }
  main { flex:1; padding:28px 56px 0; overflow:auto; }
  footer { display:flex; align-items:center; gap:14px; padding:20px 56px 28px; }
  footer .note { flex:1; color:var(--mut); font-size:13px; }
  .btn { border:1px solid rgba(255,255,255,0.22); background:transparent; color:var(--fg); height:52px; min-width:150px; padding:0 28px; border-radius:30px; font-size:14px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:transform .15s, background .15s; }
  .btn:hover { background:rgba(255,255,255,0.06); }
  .btn.primary { background:#f1f2f5; color:#0b0b0e; border-color:#f1f2f5; min-width:230px; box-shadow:0 0 0 3px rgba(169,187,224,0.25); }
  .btn.primary:hover { transform:translateY(-1px); }
  .btn:disabled { opacity:.35; cursor:default; transform:none; }
  .cols { display:grid; grid-template-columns: 1.1fr 1fr; gap:46px; }
  .lead { font-size:17px; color:#d9dbe1; margin:0 0 22px; }
  .sec { letter-spacing:3px; font-size:12px; color:var(--mut); text-transform:uppercase; margin:0 0 12px; }
  ul.steps { list-style:none; padding:0; margin:0 0 26px; }
  ul.steps li { padding:4px 0 4px 22px; position:relative; color:#d9dbe1; }
  ul.steps li:before { content:''; position:absolute; left:2px; top:12px; width:8px; height:8px; border-radius:2px; background:var(--acc); transform:rotate(45deg); }
  .links { display:grid; grid-template-columns:110px 1fr; row-gap:6px; font-size:14px; }
  .links span { color:var(--dim); }
  .links a { color:var(--acc); text-decoration:none; cursor:pointer; }
  .notes { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; height:360px; overflow:auto; font-size:14px; color:#c9ccd4; white-space:pre-wrap; user-select:text; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; cursor:pointer; transition:background .15s, border-color .15s; }
  .opt:hover { background:var(--card2); }
  .opt.on { border-color:rgba(169,187,224,0.6); background:var(--card2); }
  .opt .t { font-size:16px; font-weight:600; } .opt .s { font-size:13px; color:var(--mut); }
  .opt .x { flex:1; }
  .dot { width:20px; height:20px; border-radius:50%; border:2px solid #4b505c; flex:none; }
  .opt.on .dot { border-color:var(--acc); background: radial-gradient(circle, var(--acc) 45%, transparent 50%); }
  .box { width:20px; height:20px; border-radius:6px; border:2px solid #4b505c; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:#0b0b0e; }
  .opt.on .box { background:var(--acc); border-color:var(--acc); }
  .opt .size { color:var(--mut); font-size:14px; }
  .terms { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; height:330px; overflow:auto; font:12.5px/1.55 Consolas, monospace; color:#b9bcc6; white-space:pre-wrap; user-select:text; margin-bottom:14px; }
  .path { display:flex; gap:12px; align-items:center; margin:16px 0 4px; }
  .path .p { flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 16px; font-size:14px; color:#d9dbe1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; }
  .path .btn { height:46px; min-width:120px; }
  .bar { height:10px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; margin:26px 0 14px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, #8ea2cc, #e9edf6); border-radius:6px; transition:width .25s; }
  .bar.ind i { width:35%; animation:ind 1.2s ease-in-out infinite; }
  @keyframes ind { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
  .stepline { color:var(--mut); }
  .done { display:flex; align-items:center; gap:20px; margin:4px 0 24px; }
  .done .ok { width:64px; height:64px; border-radius:50%; background:#e9edf6; color:#0b0b0e; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; }
  .done .t { font-size:22px; font-weight:600; } .done .s { color:var(--mut); }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 22px; margin-bottom:20px; color:#d9dbe1; }
  .err { color:#ff9a9a; margin-top:10px; white-space:pre-wrap; }
  [dir=rtl] ul.steps li { padding:4px 22px 4px 0; } [dir=rtl] ul.steps li:before { left:auto; right:2px; }
  .page { display:none; animation:fade .25s ease-out; } .page.show { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="frame">
  <div class="drag"></div>
  <div class="wc"><button id="wmin" title="Minimize">&#8211;</button><button id="wclose" title="Close">&#10005;</button></div>
  <header>
    <img src="logo.png" alt="">
    <div><div class="kicker" id="kicker">Stremio Kai 7M</div><h1 id="title">Welcome</h1></div>
  </header>
  <main>
    <!-- 1 Welcome -->
    <section class="page" id="p-welcome">
      <div class="cols">
        <div>
          <p class="lead" data-t="intro"></p>
          <div class="sec" data-t="next"></div>
          <ul class="steps"><li data-t="n1"></li><li data-t="n2"></li><li data-t="n3"></li><li data-t="n4"></li></ul>
          <div class="links">
            <span data-t="source"></span><a data-url="https://github.com/moahmmed597/Stremio-Kai-7M">github.com/moahmmed597/Stremio-Kai-7M</a>
            <span data-t="bugs"></span><a data-url="https://github.com/moahmmed597/Stremio-Kai-7M/issues">GitHub Issues</a>
          </div>
        </div>
        <div>
          <div class="sec" data-t="whatsnew"></div>
          <div class="notes" id="notes">…</div>
        </div>
      </div>
    </section>
    <!-- 2 Language -->
    <section class="page" id="p-lang">
      <div class="grid2" id="langs"></div>
    </section>
    <!-- 3 Terms -->
    <section class="page" id="p-terms">
      <div class="terms" id="license"></div>
      <div class="opt" id="accept"><div class="box">✓</div><div class="x"><div class="t" data-t="accept"></div></div></div>
    </section>
    <!-- 4 What gets installed -->
    <section class="page" id="p-pick">
      <div class="opt" id="o-clean" style="margin-bottom:14px"><div class="box">✓</div><div class="x"><div class="t" data-t="clean"></div><div class="s" data-t="cleanS"></div></div></div>
      <div class="grid2">
        <div class="opt on" style="cursor:default"><div class="x"><div class="t">Stremio Kai 7M</div><div class="s" data-t="appS"></div></div><div class="size" id="dl-size"></div></div>
        <div class="opt on" style="cursor:default"><div class="x"><div class="t" data-t="noAdmin"></div><div class="s" data-t="noAdminS"></div></div></div>
        <div class="opt on" id="o-desktop"><div class="box">✓</div><div class="x"><div class="t" data-t="desk"></div><div class="s" data-t="deskS"></div></div></div>
        <div class="opt on" id="o-start"><div class="box">✓</div><div class="x"><div class="t" data-t="startm"></div><div class="s" data-t="startmS"></div></div></div>
        <div class="opt" id="o-boot"><div class="box">✓</div><div class="x"><div class="t" data-t="boot"></div><div class="s" data-t="bootS"></div></div></div>
      </div>
      <div class="path"><div class="p" id="dir"></div><button class="btn" id="change" data-t="change"></button></div>
    </section>
    <!-- 5 Installing -->
    <section class="page" id="p-run">
      <div class="bar" id="bar"><i id="barfill"></i></div>
      <div class="stepline" id="stepline"></div>
      <div class="err" id="err"></div>
    </section>
    <!-- 6 Ready -->
    <section class="page" id="p-done">
      <div class="done"><div class="ok">✓</div><div><div class="t" data-t="ready2"></div><div class="s" id="donever"></div></div></div>
      <div class="summary" id="summary"></div>
      <div class="opt on" id="o-launch" style="max-width:420px"><div class="box">✓</div><div class="x"><div class="t" data-t="launch"></div></div></div>
    </section>
  </main>
  <footer>
    <div class="note" id="foot"></div>
    <button class="btn" id="back"></button>
    <button class="btn primary" id="next"></button>
  </footer>
</div>
<script>
const T = {
  en: { welcome:'Welcome', lang:'Choose your language', terms:'Read the terms', pick:'What gets installed', run:'Installing', ready:'Stremio Kai 7M is ready',
    intro:'Stremio Kai 7M is a Stremio client for movies, series, anime, manga, books and live TV. This installer sets it up for your account only and needs no administrator rights.',
    next:'What happens next', n1:'Pick the language the app opens in', n2:'Read the terms and accept them', n3:'Choose shortcuts and the folder', n4:'Install, then launch Stremio Kai 7M',
    source:'Source', bugs:'Bugs', whatsnew:"What's new", accept:'I accept the terms of the GNU GPL-3.0 licence',
    clean:'Clean install', cleanS:'Removes the app settings and cached data on this PC before installing. Your Stremio account is not touched.',
    appS:'App, player and catalogs (downloaded from this release on GitHub)', noAdmin:'For this user only', noAdminS:'Installed in your user folder, no administrator rights',
    desk:'Desktop shortcut', deskS:'An icon on the desktop', startm:'Start menu', startmS:'Find it in Start and search', boot:'Start with Windows', bootS:'Opens when you sign in',
    change:'Change', back:'Back', cont:'Continue', install:'Install', repair:'Update', close:'Close', retry:'Retry',
    footW:'Free and open source · GPL-3.0 · moahmmed597', footL:'The app will open in {l}.', footP:'Installs {v} into your user folder',
    footR:'Updates {v} · your library and settings are kept', s1:'Downloading Stremio Kai 7M… {p}%', s2:'Cleaning old data…', s3:'Unpacking files…', s4:'Creating shortcuts…', s5:'Done',
    ready2:'Installed', launch:'Launch Stremio Kai 7M now', sumDir:'Installed to', sumDesk:'Desktop shortcut created', sumStart:'Added to the Start menu', sumBoot:'Starts with Windows',
    footD:'Stremio Kai 7M will open when this window closes.', failed:'Installation failed' },
  ar: { welcome:'أهلاً بك', lang:'اختر لغتك', terms:'اقرأ الشروط', pick:'وش راح يتثبت', run:'جاري التثبيت', ready:'Stremio Kai 7M جاهز',
    intro:'Stremio Kai 7M تطبيق ستريمو للأفلام والمسلسلات والأنمي والمانجا والكتب والبث المباشر. هذا المثبّت يثبّته لحسابك فقط وما يحتاج صلاحيات مدير.',
    next:'الخطوات الجاية', n1:'اختر لغة التطبيق', n2:'اقرأ الشروط ووافق عليها', n3:'اختر الاختصارات والمجلد', n4:'ثبّت وشغّل Stremio Kai 7M',
    source:'المصدر', bugs:'المشاكل', whatsnew:'الجديد', accept:'أوافق على شروط ترخيص GNU GPL-3.0',
    clean:'تثبيت نظيف', cleanS:'يمسح إعدادات التطبيق وملفاته المؤقتة على هذا الجهاز قبل التثبيت. حساب ستريمو ما يتأثر.',
    appS:'التطبيق والمشغل والقوائم (ينزل من هذا الإصدار على GitHub)', noAdmin:'لهذا المستخدم فقط', noAdminS:'يتثبت في مجلدك بدون صلاحيات مدير',
    desk:'اختصار سطح المكتب', deskS:'أيقونة على سطح المكتب', startm:'قائمة ابدأ', startmS:'تلقاه في ابدأ والبحث', boot:'يشتغل مع ويندوز', bootS:'يفتح لما تسجل دخول',
    change:'تغيير', back:'رجوع', cont:'متابعة', install:'تثبيت', repair:'تحديث', close:'إغلاق', retry:'إعادة المحاولة',
    footW:'مجاني ومفتوح المصدر · GPL-3.0 · moahmmed597', footL:'التطبيق بيفتح بـ{l}.', footP:'يثبّت {v} في مجلد المستخدم',
    footR:'يحدّث {v} · مكتبتك وإعداداتك تبقى', s1:'جاري تنزيل Stremio Kai 7M… {p}%', s2:'مسح البيانات القديمة…', s3:'فك الملفات…', s4:'إنشاء الاختصارات…', s5:'تم',
    ready2:'تم التثبيت', launch:'شغّل Stremio Kai 7M الحين', sumDir:'مكان التثبيت', sumDesk:'تم إنشاء اختصار سطح المكتب', sumStart:'أُضيف لقائمة ابدأ', sumBoot:'يشتغل مع ويندوز',
    footD:'Stremio Kai 7M بيفتح لما تسكّر هذي النافذة.', failed:'فشل التثبيت' },
  pt: { welcome:'Bem-vindo', lang:'Escolha o idioma', terms:'Leia os termos', pick:'O que será instalado', run:'Instalando', ready:'Stremio Kai 7M está pronto',
    intro:'Stremio Kai 7M é um cliente Stremio para filmes, séries, animes, mangás, livros e TV ao vivo. Este instalador o configura só para a sua conta, sem direitos de administrador.',
    next:'Próximos passos', n1:'Escolha o idioma do app', n2:'Leia e aceite os termos', n3:'Escolha os atalhos e a pasta', n4:'Instale e abra o Stremio Kai 7M',
    source:'Código', bugs:'Problemas', whatsnew:'Novidades', accept:'Aceito os termos da licença GNU GPL-3.0',
    clean:'Instalação limpa', cleanS:'Apaga os ajustes e o cache do app neste PC antes de instalar. Sua conta Stremio não é afetada.',
    appS:'App, player e catálogos (baixado desta versão no GitHub)', noAdmin:'Só para este usuário', noAdminS:'Instalado na sua pasta, sem administrador',
    desk:'Atalho na área de trabalho', deskS:'Um ícone na área de trabalho', startm:'Menu Iniciar', startmS:'Aparece no Iniciar e na busca', boot:'Abrir com o Windows', bootS:'Abre quando você entra',
    change:'Alterar', back:'Voltar', cont:'Continuar', install:'Instalar', repair:'Atualizar', close:'Fechar', retry:'Tentar de novo',
    footW:'Livre e de código aberto · GPL-3.0 · moahmmed597', footL:'O app vai abrir em {l}.', footP:'Instala a {v} na sua pasta de usuário',
    footR:'Atualiza para a {v} · biblioteca e ajustes mantidos', s1:'Baixando o Stremio Kai 7M… {p}%', s2:'Limpando dados antigos…', s3:'Extraindo arquivos…', s4:'Criando atalhos…', s5:'Pronto',
    ready2:'Instalado', launch:'Abrir o Stremio Kai 7M agora', sumDir:'Instalado em', sumDesk:'Atalho na área de trabalho criado', sumStart:'Adicionado ao menu Iniciar', sumBoot:'Abre com o Windows',
    footD:'O Stremio Kai 7M abre quando esta janela fechar.', failed:'A instalação falhou' },
};
const LANGS = [ { id:'en', name:'English', sub:'English' }, { id:'ar', name:'العربية', sub:'Arabic' }, { id:'pt', name:'Português', sub:'Portuguese' } ];
const PAGES = ['welcome','lang','terms','pick','run','done'];
const st = { page:0, lang:(navigator.language||'en').slice(0,2), accept:false, clean:false, desktop:true, startMenu:true, startup:false, launch:true, dir:'', info:null, result:null, busy:false };
if (!T[st.lang]) st.lang = 'en';
const $ = (id) => document.getElementById(id);
const tr = (k, v) => String(T[st.lang][k] || T.en[k] || k).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] !== undefined ? v[x] : m));

function toggle(id, key) { $(id).onclick = () => { if (st.busy) return; st[key] = !st[key]; $(id).classList.toggle('on', st[key]); render(); }; }
toggle('accept','accept'); toggle('o-clean','clean'); toggle('o-desktop','desktop'); toggle('o-start','startMenu'); toggle('o-boot','startup'); toggle('o-launch','launch');
document.querySelectorAll('[data-url]').forEach((a) => (a.onclick = () => setup.open(a.getAttribute('data-url'))));
$('wmin').onclick = () => setup.window('min');
$('wclose').onclick = () => setup.window('close');
$('change').onclick = async () => { st.dir = await setup.pickDir(st.dir); render(); };

function langs() {
  const box = $('langs'); box.innerHTML = '';
  LANGS.forEach((l) => {
    const d = document.createElement('div'); d.className = 'opt' + (l.id === st.lang ? ' on' : '');
    d.innerHTML = '<div class="x"><div class="t"></div><div class="s"></div></div><div class="dot"></div>';
    d.querySelector('.t').textContent = l.name; d.querySelector('.s').textContent = l.sub;
    d.onclick = () => { st.lang = l.id; render(); };
    box.appendChild(d);
  });
}

function render() {
  const name = PAGES[st.page];
  document.documentElement.dir = st.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = tr(el.getAttribute('data-t'))));
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('show', p.id === 'p-' + name));
  const v = st.info ? st.info.version : '';
  $('kicker').textContent = 'Stremio Kai 7M · ' + v;
  $('title').textContent = tr({ welcome:'welcome', lang:'lang', terms:'terms', pick:'pick', run:'run', done:'ready' }[name]);
  $('dir').textContent = st.dir;
  langs();
  const back = $('back'), next = $('next');
  back.style.visibility = st.page > 0 && name !== 'run' && name !== 'done' ? 'visible' : 'hidden';
  back.textContent = tr('back');
  next.disabled = (name === 'terms' && !st.accept) || st.busy;
  const installed = st.info && st.info.installed;
  next.textContent = name === 'pick' ? tr(installed ? 'repair' : 'install') : name === 'done' ? tr('close') : name === 'run' ? (st.result && !st.result.ok ? tr('retry') : tr('cont')) : tr('cont');
  next.style.visibility = name === 'run' && !(st.result && !st.result.ok) ? 'hidden' : 'visible';
  $('o-clean').style.display = installed ? '' : 'none';
  $('foot').textContent = name === 'welcome' ? tr('footW') : name === 'lang' ? tr('footL', { l: LANGS.find((x) => x.id === st.lang).name }) : name === 'pick' ? tr(installed ? 'footR' : 'footP', { v: v }) : name === 'done' ? tr('footD') : '';
}

$('back').onclick = () => { if (st.page > 0) { st.page--; render(); } };
$('next').onclick = async () => {
  const name = PAGES[st.page];
  if (name === 'done') { if (st.launch && st.result) setup.launch(st.result.dir); else setup.window('close'); return; }
  if (name === 'pick' || name === 'run') return runInstall();
  st.page++; render();
};

setup.onProgress((d) => {
  const bar = $('bar'), fill = $('barfill');
  if (d.step === 1) { bar.classList.toggle('ind', !d.pct); fill.style.width = (d.pct || 0) + '%'; $('stepline').textContent = tr('s1', { p: d.pct || 0 }); }
  else { bar.classList.add('ind'); fill.style.width = ''; $('stepline').textContent = tr('s' + d.step); }
  if (d.step === 5) { bar.classList.remove('ind'); fill.style.width = '100%'; }
});

async function runInstall() {
  st.page = PAGES.indexOf('run'); st.busy = true; st.result = null; $('err').textContent = ''; render();
  const r = await setup.install({ dir: st.dir, clean: st.clean, desktop: st.desktop, startMenu: st.startMenu, startup: st.startup, language: st.lang });
  st.busy = false; st.result = r;
  if (!r.ok) { $('stepline').textContent = tr('failed'); $('err').textContent = r.error; $('bar').classList.remove('ind'); render(); return; }
  const lines = [tr('sumDir') + ': ' + r.dir];
  if (st.desktop) lines.push(tr('sumDesk')); if (st.startMenu) lines.push(tr('sumStart')); if (st.startup) lines.push(tr('sumBoot'));
  $('summary').innerHTML = ''; lines.forEach((l) => { const d = document.createElement('div'); d.textContent = '• ' + l; $('summary').appendChild(d); });
  $('donever').textContent = 'Version ' + st.info.version + (r.size ? ' · ' + Math.round(r.size / 1024) + ' MB' : '');
  st.page = PAGES.indexOf('done'); render();
}

(async () => {
  st.info = await setup.info();
  st.dir = (st.info.installed && st.info.installed.dir) || st.info.defaultDir;
  $('license').textContent = st.info.license || 'GNU GPL-3.0';
  render();
  setup.notes().then((n) => ($('notes').textContent = n || 'Stremio Kai 7M ' + st.info.version));
  setup.size().then((b) => ($('dl-size').textContent = b ? Math.round(b / 1048576) + ' MB' : ''));
})();
</script>
</body>
</html>
